General:
  Prefix: "&dPortal&5Lock &8»&r"
  NoPermission: "%prefix% &cYou do not have permission to do that."
  DimensionNotFound: "%prefix% &cFailed to get the &e%dimension%&c dimension."
  UnknownError: "%prefix% &cUnknown error happened. Please report it."
Commands:
  Help:
    Syntax: " <page>"
    Desc: "Shows information about the commands."
    Title: "&e=== &aPortalLock Help &e=== &aPage &c%page%&a/&c%maxpage% &e==="
    Info: "   &c[] &7- &6Required   &c<> &7- &6Optional"
    Line: "&2/portallock %subcommand%&a%syntax% &8» &7%description%"
  Reload:
    Desc: "Reloads the plugin config and its messages."
    Success: "%prefix% &aThe plugin has been reloaded."
  Version:
    Desc: "Shows the plugin version."
    Current: "%prefix% &aYou are using the '&3%version%&a' version of PortalLock."
    UpToDate: "%prefix% &aPortalLock is up to date."
    Outdated: "%prefix% &cPortalLock is outdated. You can download it here: &e%link%"
  Add:
    Syntax: " [world]"
    Desc: "Adds a new dimension."
    Usage: "%prefix% &aUsage: &e/portallock add [world]"
    AlreadyExist: "%prefix% &cThe &e%dimension% &cdimension already exists."
    Success: "%prefix% &aYou have successfully added the &e%dimension%&a dimension."
  Edit:
    Syntax: " [world] [field] [value]"
    Desc: "Edits an existing dimension."
    Usage: "%prefix% &aUsage: &e/portallock edit [world] [field] [value]"
    InvalidField: "%prefix% &cThe &e%value%&c field does not exist."
    InvalidWorldKey: "%prefix% &cThe &e%value%&c world key is invalid."
    InvalidBoolean: "%prefix% &e%value%&c is not a valid boolean value."
    InvalidNumber: "%prefix% &e%value%&c is not a valid number. Valid types: &eByte, Integer, Double, Float"
    InvalidDate: "%prefix% &e%value%&c is not a valid date. Valid format: &eyyyy-MM-dd HH:mm"
    Success: "%prefix% &aYou have successfully modified the dimension."
  Remove:
    Syntax: " [world]"
    Desc: "Removes an existing dimension."
    Usage: "%prefix% &aUsage: &e/portallock remove [world]"
    Success: "%prefix% &aYou have successfully removed the &e%dimension%&a dimension."
  List:
    Syntax: " <page>"
    Desc: "Shows the list of available dimensions."
    Title: "&e========== &6Dimensions &e=========="
    Line: "&7» &6%dimension% &8- %button1% %button2%"
    AddBtn: "&8[&aAdd&8]"
    InfoBtn: "&8[&aInfo&8]"
    RemoveBtn: "&8[&cRemove&8]"
    Bottom: "&e====== %prev_btn%&6%current_page%&e/&6%max_page%%next_btn% &e======"
    PrevBtn: "&6<<< "
    NextBtn: " &6>>>"
  Info":
    Syntax: " [world] <page>"
    Desc: "Shows the information about the dimension."
    Usage: "%prefix% &aUsage: &e/portallock info [world] <page>"
    Title: "&e====== &6Dimension &e====== &3%dimension% &e======"
    Line: "&7» &6%variable% &8- %button1% %button2%"
    Bottom: "&e========== %prev_btn%&6%current_page%&e/&6%max_page%%next_btn% &e=========="
    PrevBtn: "&6<<< "
    NextBtn: " &6>>>"
    Active: "&f%value%"
    Inactive: "&8%value%"
    ActionAllow: "Allow"
    ActionDeny: "Deny"
    ActionWorld: "World"
    ActionCustom: "Custom Text"
  Events:
    Add: "&6Click to add."
    Set: "&6Click to set."
    Remove: "&6Click to remove"
    View: "&6Click to view."
    Navigate: "&6Click to navigate."
